name: CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
    tags:
    - "v*"
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: "1.26.1"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Lint & Static Analysis
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.11.1
        args: --timeout 5m

    - name: Run go vet
      run: go vet ./...

  # ─────────────────────────────────────────────────────────────────
  # Unit Tests (no external dependencies)
  # ─────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cashpilotx_test
        ports:
        - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d cashpilotx_test" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Install golang-migrate
      run: |
        curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
        sudo mv migrate /usr/local/bin/migrate

    - name: Run database migrations
      run: |
        migrate -path db/migrations -database "postgres://testuser:testpassword@localhost:5432/cashpilotx_test?sslmode=disable" up

    - name: Create test config
      run: |
        cat > .env << EOF
        DATABASE_URL=postgres://testuser:testpassword@localhost:5432/cashpilotx_test?sslmode=disable
        REDIS_HOST=localhost
        REDIS_PORT=6379
        REDIS_PASSWORD=
        SERVER_PORT=8080
        JWT_SECRET=test-secret-key-for-ci-testing-only
        JWT_ACCESS_TOKEN_TTL=15m
        JWT_REFRESH_TOKEN_TTL=24h
        APP_ENV=test
        EOF

    - name: Run unit tests
      run: |
        go test -v -race -short -coverprofile=coverage-unit.out ./...
      env:
        CGO_ENABLED: 1
        DATABASE_URL: postgres://testuser:testpassword@localhost:5432/cashpilotx_test?sslmode=disable
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        REDIS_PASSWORD: ""
        JWT_SECRET: test-secret-key-for-ci-testing-only

    - name: Upload unit test coverage
      uses: actions/upload-artifact@v4
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      continue-on-error: true
      with:
        name: coverage-unit
        path: coverage-unit.out
        retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # Integration Tests (with PostgreSQL & Redis)
  # ─────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cashpilotx_test
        ports:
        - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d cashpilotx_test" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Install golang-migrate
      run: |
        curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
        sudo mv migrate /usr/local/bin/migrate

    - name: Run database migrations
      run: |
        migrate -path db/migrations -database "postgres://testuser:testpassword@localhost:5432/cashpilotx_test?sslmode=disable" up

    - name: Download dependencies
      run: go mod download

    - name: Create test config
      run: |
        cat > .env << EOF
        DATABASE_URL=postgres://testuser:testpassword@localhost:5432/cashpilotx_test?sslmode=disable
        REDIS_HOST=localhost
        REDIS_PORT=6379
        REDIS_PASSWORD=
        SERVER_PORT=8080
        JWT_SECRET=test-secret-key-for-ci-testing-only
        JWT_ACCESS_TOKEN_TTL=15m
        JWT_REFRESH_TOKEN_TTL=24h
        APP_ENV=test
        EOF

    - name: Run integration tests
      run: |
        go test -v -race -coverprofile=coverage-integration.out ./...
      env:
        CGO_ENABLED: 1
        DATABASE_URL: postgres://testuser:testpassword@localhost:5432/cashpilotx_test?sslmode=disable
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        REDIS_PASSWORD: ""
        JWT_SECRET: test-secret-key-for-ci-testing-only
    # - name: Upload integration test coverage
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: coverage-integration
    #     path: coverage-integration.out

    # ─────────────────────────────────────────────────────────────────
    # Security Scanning
    # ─────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out results.sarif ./...'

    - name: Run govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      continue-on-error: true # stdlib vulns — revisit when Go patches are released

  # ─────────────────────────────────────────────────────────────────
  # Build & Push Docker Images
  # ─────────────────────────────────────────────────────────────────
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests, integration-tests ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase image name
      run: echo "IMAGE_NAME=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-

    - name: Build and push Server image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./deploy/Dockerfile
        push: true
        platforms: linux/amd64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ github.ref_name }}

  # ─────────────────────────────────────────────────────────────────
  # Deploy to Fly.io (main branch only)
  # Deploys from the image already pushed to GHCR by the docker job,
  # avoiding a second Depot/remote build that can time out.
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests, integration-tests, docker ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: deploy-production
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Log in to Fly.io registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Pull from GHCR, retag, push to Fly.io registry
        run: |
          docker pull ghcr.io/${{ env.IMAGE_NAME }}:main
          docker tag  ghcr.io/${{ env.IMAGE_NAME }}:main registry.fly.io/cashpilotx-api:latest
          docker push registry.fly.io/cashpilotx-api:latest

      - name: Deploy from Fly.io registry
        run: flyctl deploy --image registry.fly.io/cashpilotx-api:latest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
