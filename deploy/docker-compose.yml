name: cashpilotx
services:
  postgres:
    image: postgres:18-alpine
    networks: [ cashpilotx ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - ../.env
    volumes:
      - ./db-data/postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    networks: [ cashpilotx ]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - ./db-data/redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: always
    networks: [ cashpilotx ]
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks: [ cashpilotx ]
    env_file:
      - ../.env
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./db-data/minio_data:/data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mino_init:
    image: minio/mc:latest
    networks: [ cashpilotx ]
    env_file:
      - ../.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY};
        mc mb --ignore-existing myminio/$${S3_BUCKET};
        mc anonymous set none myminio/$${S3_BUCKET};
        echo 'MinIO bucket ready.';
       "   
# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────


networks:
  cashpilotx:
    driver: bridge

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  minio-data:
