basePath: /api/v1
definitions:
  dto.ChannelConfigResponse:
    properties:
      channel:
        type: string
      config:
        type: object
      config_version:
        type: integer
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_connected_at:
        type: string
      last_error:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.CreateCustomerRequest:
    properties:
      country:
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      notes:
        maxLength: 2000
        type: string
      phone:
        maxLength: 30
        minLength: 3
        type: string
      tags:
        items:
          type: string
        type: array
      type:
        enum:
        - customer
        - supplier
        - both
        type: string
    required:
    - name
    - type
    type: object
  dto.CustomerResponse:
    properties:
      country:
        type: string
      created_at:
        type: string
      credit_limit:
        type: integer
      id:
        type: string
      last_activity:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      total_owed:
        type: integer
      total_paid:
        type: integer
      type:
        type: string
      updated_at:
        type: string
    type: object
  dto.ErrorBody:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/dto.ErrorDetail'
        type: array
      message:
        type: string
      request_id:
        type: string
    type: object
  dto.ErrorDetail:
    properties:
      code:
        type: string
      field:
        type: string
      message:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dto.ErrorBody'
    type: object
  dto.ForgotPINRequest:
    properties:
      identifier:
        maxLength: 254
        minLength: 3
        type: string
    required:
    - identifier
    type: object
  dto.IngestBatchRequest:
    properties:
      data: {}
      env_id:
        example: env_abc123
        type: string
    type: object
  dto.IngestBatchResponse:
    properties:
      status:
        example: queued
        type: string
    type: object
  dto.LoginRequest:
    properties:
      phone:
        type: string
      pin:
        type: string
    required:
    - phone
    - pin
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.LogoutRequest:
    properties:
      logout_all:
        description: true = revoke all sessions
        type: boolean
      session_id:
        description: specific session; empty = current token only
        type: string
    type: object
  dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  dto.Meta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      page:
        type: integer
      per_page:
        type: integer
      took:
        type: string
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RefreshTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      business_name:
        maxLength: 100
        minLength: 2
        type: string
      confirm_pin:
        type: string
      email:
        type: string
      home_currency:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      phone:
        type: string
      pin:
        type: string
    required:
    - confirm_pin
    - email
    - home_currency
    - name
    - phone
    - pin
    type: object
  dto.RegisterResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.ResetPINRequest:
    properties:
      confirm_pin:
        type: string
      identifier:
        maxLength: 254
        minLength: 3
        type: string
      new_pin:
        type: string
      otp:
        type: string
    required:
    - confirm_pin
    - identifier
    - new_pin
    - otp
    type: object
  dto.Response:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/dto.Meta'
      request_id:
        type: string
      success:
        type: boolean
    type: object
  dto.SessionResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      ip_address:
        type: string
      last_active_at:
        type: string
      user_agent:
        type: string
    type: object
  dto.SetChannelActiveRequest:
    properties:
      is_active:
        type: boolean
    type: object
  dto.UpdateCustomerRequest:
    properties:
      country:
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      notes:
        maxLength: 2000
        type: string
      phone:
        maxLength: 30
        minLength: 3
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  dto.UpsertChannelConfigRequest:
    properties:
      channel:
        maxLength: 50
        minLength: 1
        type: string
      config:
        type: object
      is_active:
        type: boolean
    required:
    - channel
    - config
    type: object
  dto.UserResponse:
    properties:
      business_name:
        type: string
      created_at:
        type: string
      home_currency:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
      plan:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: http://example.com/support
  description: A comprehensive development toolkit for CashpilotX environments with
    profiling, monitoring, and optimization features.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: CashpilotX API
  version: 1.0.0
paths:
  /agent/batch:
    post:
      consumes:
      - application/json
      description: |-
        Agent endpoint: receive an aggregated batch of ORM stats and critical events.
        The batch is pushed onto a Redis stream for asynchronous processing by the ingest worker.
        Supports gzip-compressed bodies (Content-Encoding: gzip). Max body size: 5 MB.
      parameters:
      - description: Aggregated batch payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.IngestBatchRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dto.IngestBatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Ingest aggregated batch
      tags:
      - agent
  /auth/forgot-pin:
    post:
      consumes:
      - application/json
      description: Send a 6-digit OTP to the user's registered email. Accepts phone
        or email as identifier.
      parameters:
      - description: Phone or email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPINRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Request PIN reset OTP
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with phone and PIN; returns access and refresh tokens.
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "423":
          description: Locked
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke the current session or all sessions. Requires Bearer token.
      parameters:
      - description: Logout options
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access/refresh token pair.
      parameters:
      - description: Refresh token payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new CashPilotX account with phone number and PIN.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register new user
      tags:
      - auth
  /auth/reset-pin:
    post:
      consumes:
      - application/json
      description: Verify the OTP and set a new PIN. All existing sessions are revoked
        on success.
      parameters:
      - description: OTP + new PIN
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPINRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Reset PIN using OTP
      tags:
      - auth
  /auth/sessions:
    get:
      description: Return all active sessions for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.SessionResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List active sessions
      tags:
      - auth
  /auth/sessions/{session_id}:
    delete:
      description: Revoke a specific session by ID for the authenticated user.
      parameters:
      - description: Session UUID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke a session
      tags:
      - auth
  /channel-configs:
    get:
      description: Return all channel configs for the authenticated user (config payload
        omitted — use GET /{channel} to decrypt).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ChannelConfigResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List channel configs
      tags:
      - channel-configs
    post:
      consumes:
      - application/json
      description: Create or update a messaging channel config (e.g. WhatsApp, Messenger).
        The config JSON is encrypted at rest with AES-256-GCM.
      parameters:
      - description: Channel config payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpsertChannelConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ChannelConfigResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upsert channel config
      tags:
      - channel-configs
  /channel-configs/{channel}:
    delete:
      description: Soft-delete a channel config by channel name.
      parameters:
      - description: Channel name
        in: path
        name: channel
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete channel config
      tags:
      - channel-configs
    get:
      description: Fetch a single channel config by channel name with decrypted config
        payload.
      parameters:
      - description: Channel name (e.g. whatsapp, messenger, line)
        in: path
        name: channel
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ChannelConfigResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get channel config
      tags:
      - channel-configs
  /channel-configs/{channel}/active:
    patch:
      consumes:
      - application/json
      description: Toggle the is_active flag on a channel config.
      parameters:
      - description: Channel name
        in: path
        name: channel
        required: true
        type: string
      - description: Active flag
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SetChannelActiveRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Enable / disable channel
      tags:
      - channel-configs
  /customers:
    get:
      description: Return a paginated list of active customers for the authenticated
        user.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 25, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CustomerResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List customers
      tags:
      - customers
    post:
      consumes:
      - application/json
      description: Create a new customer record for the authenticated user.
      parameters:
      - description: Customer payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CustomerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create customer
      tags:
      - customers
  /customers/{customer_id}:
    delete:
      description: Soft-delete a customer by setting their status to inactive.
      parameters:
      - description: Customer UUID
        in: path
        name: customer_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Archive customer
      tags:
      - customers
    get:
      description: Fetch a single customer by ID.
      parameters:
      - description: Customer UUID
        in: path
        name: customer_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CustomerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get customer
      tags:
      - customers
    patch:
      consumes:
      - application/json
      description: Partially update a customer's name, phone, country, notes, or tags.
      parameters:
      - description: Customer UUID
        in: path
        name: customer_id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCustomerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CustomerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update customer
      tags:
      - customers
  /customers/search:
    get:
      description: Full-text search across customer name and phone (max 20 results).
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CustomerResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search customers
      tags:
      - customers
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
