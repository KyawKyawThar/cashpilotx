basePath: /
definitions:
  dto.AuditLogResponse:
    properties:
      action_label:
        type: string
      action_type:
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      detail:
        type: string
      entity_type:
        type: string
      id:
        type: string
      invoice_id:
        type: string
      invoice_number:
        type: string
      is_reverted:
        type: boolean
      message_id:
        type: string
      metadata:
        type: object
      payment_id:
        type: string
      performed_by:
        type: string
      reminder_id:
        type: string
      reverted_at:
        type: string
      reverted_by:
        type: string
    type: object
  dto.ChannelConfigResponse:
    properties:
      channel:
        type: string
      config:
        type: object
      config_version:
        type: integer
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_connected_at:
        type: string
      last_error:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.ChatMessageResponse:
    properties:
      channel:
        type: string
      content:
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      direction:
        type: string
      external_message_id:
        type: string
      id:
        type: string
      invoice_id:
        type: string
      meta:
        type: object
      sent_at:
        type: string
      source:
        type: string
      status:
        type: string
      tone:
        type: string
    type: object
  dto.CopyTextResponse:
    properties:
      content:
        type: string
      message_id:
        type: string
    type: object
  dto.CreateCustomerRequest:
    properties:
      country:
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      notes:
        maxLength: 2000
        type: string
      phone:
        type: string
      tags:
        items:
          type: string
        type: array
      type:
        enum:
        - customer
        - supplier
        - both
        type: string
    required:
    - name
    - type
    type: object
  dto.CreateInvoiceRequest:
    properties:
      amount:
        example: 150000
        minimum: 1
        type: integer
      channel:
        enum:
        - line
        - whatsapp
        - messenger
        - wechat
        - telegram
        example: whatsapp
        type: string
      currency:
        example: USD
        type: string
      customer_id:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      description:
        example: Web design services - May 2026
        maxLength: 500
        type: string
      due_date:
        example: "2026-06-01T00:00:00Z"
        type: string
      items:
        items:
          type: object
        type: array
      max_attempts:
        example: 3
        maximum: 10
        minimum: 1
        type: integer
      photo_url:
        example: https://example.com/invoice.jpg
        type: string
      scheduled_at:
        example: "2026-05-20T09:00:00Z"
        type: string
      source:
        example: manual
        maxLength: 100
        type: string
      tone:
        description: First reminder — all optional, defaults applied in service.
        enum:
        - polite
        - firm
        - urgent
        example: polite
        type: string
    required:
    - amount
    - currency
    - customer_id
    - due_date
    type: object
  dto.CreateInvoiceResponse:
    properties:
      invoice:
        $ref: '#/definitions/dto.InvoiceResponse'
      reminder:
        $ref: '#/definitions/dto.ReminderResponse'
    type: object
  dto.CreateManualMessageRequest:
    properties:
      channel:
        enum:
        - line
        - whatsapp
        - messenger
        - wechat
        - telegram
        - external
        type: string
      content:
        maxLength: 4000
        minLength: 1
        type: string
      customer_id:
        type: string
      invoice_id:
        type: string
      tone:
        enum:
        - polite
        - firm
        - urgent
        - final
        type: string
    required:
    - channel
    - content
    - customer_id
    - invoice_id
    type: object
  dto.CreateReminderRequest:
    properties:
      channel:
        enum:
        - line
        - whatsapp
        - messenger
        - wechat
        - telegram
        type: string
      customer_id:
        type: string
      max_attempts:
        maximum: 10
        minimum: 1
        type: integer
      scheduled_at:
        type: string
      tone:
        enum:
        - polite
        - firm
        - urgent
        - final
        type: string
    required:
    - customer_id
    - scheduled_at
    type: object
  dto.CustomerEventResponse:
    properties:
      created_at:
        type: string
      customer_id:
        type: string
      event_type:
        type: string
      event_value:
        type: object
      id:
        type: string
      invoice_id:
        type: string
    type: object
  dto.CustomerResponse:
    properties:
      country:
        type: string
      created_at:
        type: string
      credit_limit:
        type: integer
      customer_number:
        type: string
      id:
        type: string
      last_activity:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      total_owed:
        type: integer
      total_paid:
        type: integer
      type:
        type: string
      updated_at:
        type: string
    type: object
  dto.DashboardResponse:
    properties:
      collected_this_month:
        type: integer
      open_actions:
        type: integer
      reminded_count:
        type: integer
      total_messages_sent:
        type: integer
      total_recoverable:
        type: integer
      waiting_for_reply:
        type: integer
    type: object
  dto.ErrorBody:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/dto.ErrorDetail'
        type: array
      message:
        type: string
      request_id:
        type: string
    type: object
  dto.ErrorDetail:
    properties:
      code:
        type: string
      field:
        type: string
      message:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dto.ErrorBody'
    type: object
  dto.ForgotPINRequest:
    properties:
      identifier:
        maxLength: 254
        minLength: 3
        type: string
    required:
    - identifier
    type: object
  dto.IngestBatchRequest:
    properties:
      data: {}
      env_id:
        example: env_abc123
        type: string
    type: object
  dto.IngestBatchResponse:
    properties:
      status:
        example: queued
        type: string
    type: object
  dto.InvoiceResponse:
    properties:
      amount:
        type: integer
      collection_state:
        type: string
      confidence_factors:
        type: object
      confidence_score:
        type: number
      created_at:
        type: string
      currency:
        type: string
      customer_id:
        type: string
      description:
        type: string
      due_date:
        type: string
      external_id:
        type: string
      follow_up_count:
        type: integer
      id:
        type: string
      issued_at:
        type: string
      items:
        items:
          type: object
        type: array
      last_contacted_at:
        type: string
      last_response_at:
        type: string
      outcome_text:
        type: string
      outcome_timeframe:
        type: string
      paid_amount:
        type: integer
      paid_at:
        type: string
      photo_url:
        type: string
      promised_at:
        type: string
      source:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      phone:
        type: string
      pin:
        type: string
    required:
    - phone
    - pin
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.LogoutRequest:
    properties:
      logout_all:
        description: true = revoke all sessions
        type: boolean
      session_id:
        description: specific session; empty = current token only
        type: string
    type: object
  dto.MarkMessageSentRequest:
    properties:
      external_message_id:
        maxLength: 200
        type: string
    type: object
  dto.MarkReminderSentRequest:
    properties:
      external_message_id:
        maxLength: 200
        type: string
    type: object
  dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  dto.Meta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      page:
        type: integer
      per_page:
        type: integer
      took:
        type: string
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.MoveCollectionStateRequest:
    properties:
      note:
        maxLength: 500
        type: string
      state:
        enum:
        - pending
        - reminded
        - no_response
        - negotiating
        - promised
        - paid
        - defaulted
        type: string
    required:
    - state
    type: object
  dto.PaymentListItem:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      customer_name:
        type: string
      exchange_rate:
        type: string
      id:
        type: string
      invoice_id:
        type: string
      invoice_number:
        type: string
      is_full_payment:
        description: invoice_status == "paid"
        type: boolean
      method:
        type: string
      note:
        type: string
      paid_on:
        type: string
      proof_url:
        type: string
      reference:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.PaymentResponse:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      exchange_rate:
        type: string
      id:
        type: string
      invoice_id:
        type: string
      method:
        type: string
      note:
        type: string
      paid_on:
        type: string
      proof_url:
        type: string
      reference:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.RecordPaymentRequest:
    properties:
      amount:
        minimum: 1
        type: integer
      currency:
        type: string
      customer_id:
        type: string
      exchange_rate:
        type: string
      invoice_id:
        type: string
      method:
        type: string
      note:
        maxLength: 500
        type: string
      paid_on:
        type: string
      reference:
        maxLength: 200
        type: string
    required:
    - amount
    - currency
    - customer_id
    - invoice_id
    - method
    type: object
  dto.RecordPaymentResponse:
    properties:
      invoice:
        $ref: '#/definitions/dto.InvoiceResponse'
      payment:
        $ref: '#/definitions/dto.PaymentResponse'
    type: object
  dto.RecoveryQueueItemResponse:
    properties:
      amount:
        type: integer
      collection_state:
        type: string
      confidence_score:
        type: number
      created_at:
        type: string
      currency:
        type: string
      customer_id:
        type: string
      customer_name:
        type: string
      customer_phone:
        type: string
      due_date:
        type: string
      external_id:
        type: string
      follow_up_count:
        type: integer
      id:
        type: string
      last_contacted_at:
        type: string
      outcome_text:
        type: string
      outcome_timeframe:
        type: string
      paid_amount:
        type: integer
      status:
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RefreshTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      business_name:
        maxLength: 100
        minLength: 2
        type: string
      confirm_pin:
        type: string
      email:
        type: string
      home_currency:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      phone:
        type: string
      pin:
        type: string
    required:
    - confirm_pin
    - email
    - home_currency
    - name
    - phone
    - pin
    type: object
  dto.RegisterResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.ReminderResponse:
    properties:
      channel:
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      id:
        type: string
      invoice_id:
        type: string
      max_attempts:
        type: integer
      scheduled_at:
        type: string
      status:
        type: string
      tone:
        type: string
    type: object
  dto.ResetPINRequest:
    properties:
      confirm_pin:
        type: string
      identifier:
        maxLength: 254
        minLength: 3
        type: string
      new_pin:
        type: string
      otp:
        type: string
    required:
    - confirm_pin
    - identifier
    - new_pin
    - otp
    type: object
  dto.Response:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/dto.Meta'
      request_id:
        type: string
      success:
        type: boolean
    type: object
  dto.SessionResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      ip_address:
        type: string
      last_active_at:
        type: string
      user_agent:
        type: string
    type: object
  dto.SetChannelActiveRequest:
    properties:
      is_active:
        type: boolean
    required:
    - is_active
    type: object
  dto.UpdateCustomerRequest:
    properties:
      country:
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      notes:
        maxLength: 2000
        type: string
      phone:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  dto.UpsertChannelConfigRequest:
    properties:
      channel:
        maxLength: 50
        minLength: 1
        type: string
      config:
        type: object
      is_active:
        type: boolean
    required:
    - channel
    - config
    type: object
  dto.UserResponse:
    properties:
      business_name:
        type: string
      created_at:
        type: string
      home_currency:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
      plan:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: http://example.com/support
  description: A comprehensive development toolkit for CashpilotX environments with
    profiling, monitoring, and optimization features.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: CashpilotX API
  version: 1.0.0
paths:
  /api/v1/agent/batch:
    post:
      consumes:
      - application/json
      description: |-
        Agent endpoint: receive an aggregated batch of ORM stats and critical events.
        The batch is pushed onto a Redis stream for asynchronous processing by the ingest worker.
        Supports gzip-compressed bodies (Content-Encoding: gzip). Max body size: 5 MB.
      parameters:
      - description: Aggregated batch payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.IngestBatchRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dto.IngestBatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Ingest aggregated batch
      tags:
      - agent
  /api/v1/audit-log:
    get:
      description: Returns a paginated list of operator audit log entries. Optionally
        filter by action_type.
      parameters:
      - description: Filter by action type (e.g. payment_recorded, message_marked_sent)
        in: query
        name: action_type
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 25, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AuditLogResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - audit
  /api/v1/audit-log/{log_id}/revert:
    post:
      description: Marks an audit log entry as reverted, recording who reverted it
        and when.
      parameters:
      - description: Audit log UUID
        in: path
        name: log_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuditLogResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revert audit log entry
      tags:
      - audit
  /api/v1/auth/forgot-pin:
    post:
      consumes:
      - application/json
      description: Send a 6-digit OTP to the user's registered email. Accepts phone
        or email as identifier.
      parameters:
      - description: Phone or email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPINRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Request PIN reset OTP
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with phone and PIN; returns access and refresh tokens.
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "423":
          description: Locked
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke the current session or all sessions. Requires Bearer token.
      parameters:
      - description: Logout options
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access/refresh token pair.
      parameters:
      - description: Refresh token payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new CashPilotX account with phone number and PIN.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register new user
      tags:
      - auth
  /api/v1/auth/reset-pin:
    post:
      consumes:
      - application/json
      description: Verify the OTP and set a new PIN. All existing sessions are revoked
        on success.
      parameters:
      - description: OTP + new PIN
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPINRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
